[project]
name = "htx-assessment"
version = "0.1.0"
description = "HTX AI Engineering Take-Home — Part 1 & 2: Document Extraction, MCP Date Normalisation & LLM Temporal Reasoning"
requires-python = ">=3.14"
dependencies = [
    "pdfplumber>=0.11.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.29.1,<2",
    "langchain-mcp-adapters==0.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require a real GEMINI_API_KEY (deselect with -m 'not integration')",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
